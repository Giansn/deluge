name: DelugeRec for Windows
# Builds mastertune-1.2.1/tools/deluge_rec.py into DelugeRec.exe (PyInstaller: one file, no console) after its tests,
# checks the .exe on Windows with its self-test (the window, the demo signal, a take, the monitor, PortAudio) and puts
# it on the release "deluge-rec" and as the run's artifact.
on:
  push:
    branches: [geraet-ergebnisse]
    paths:
      - mastertune-1.2.1/tools/deluge_rec.py
      - mastertune-1.2.1/tools/deluge_rec.ico
      - mastertune-1.2.1/tests/deluge_rec/**
      - .github/workflows/deluge-rec-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mastertune-1.2.1/tools
            mastertune-1.2.1/tests/deluge_rec

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pyinstaller sounddevice numpy

      - name: Tests
        run: python -B mastertune-1.2.1/tests/deluge_rec/test_deluge_rec.py

      - name: Build
        run: >-
          pyinstaller --noconfirm --onefile --windowed --name DelugeRec
          --icon mastertune-1.2.1/tools/deluge_rec.ico mastertune-1.2.1/tools/deluge_rec.py

      - name: Self-test of the .exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest"
          $p = Start-Process -FilePath dist\DelugeRec.exe -ArgumentList "--selftest", "6", "--out", $out -Wait -PassThru
          Get-Content (Join-Path $out "selftest.txt")
          Get-Item dist\DelugeRec.exe | Select-Object Name, Length
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: DelugeRec-windows
          path: dist/DelugeRec.exe

      - name: Release deluge-rec
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Records the Deluge's USB audio output (mastertune v8 or later), with a monitor on the computer's headphones or speakers. Download DelugeRec.exe and run it, nothing to install. Windows asks at the first start because the file is not signed: More info, then Run anyway. Built from ${GITHUB_SHA:0:8} (run ${GITHUB_RUN_NUMBER}). Source: mastertune-1.2.1/tools/deluge_rec.py."
          gh release view deluge-rec > /dev/null 2>&1 || gh release create deluge-rec --prerelease \
            --target "$GITHUB_SHA" --title "DelugeRec for Windows" --notes "$notes"
          gh release edit deluge-rec --title "DelugeRec for Windows" --notes "$notes"
          gh release upload deluge-rec dist/DelugeRec.exe --clobber
