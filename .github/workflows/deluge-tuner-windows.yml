name: DelugeTuner for Windows
# Builds mastertune-1.2.1/tools/deluge_tuner.py (with retune_library.py) into DelugeTuner-vN.exe (N = VERSION in
# deluge_tuner.py; PyInstaller: one file, no console, with numpy, soxr and pylibrb for Rubber Band) after its tests,
# checks the .exe on Windows with its self-test (soxr, Rubber Band, read, convert with the .exe's own worker
# processes, stop and continue, the window, English, the version) and puts it on its own release "deluge-tuner-vN".
# The release "deluge-tuner" always has the newest one as its only file. A released version is never replaced: if the
# program, retune_library.py or the icon changed since, the build stops until VERSION is raised; if not, it only
# builds and tests, and deluge-tuner gets the released file. retune_library.py's own tests: tests/retune/run.sh.
on:
  push:
    branches: [device-results]
    paths:
      - mastertune-1.2.1/tools/deluge_tuner.py
      - mastertune-1.2.1/tools/retune_library.py
      - mastertune-1.2.1/tools/deluge_tuner.ico
      - mastertune-1.2.1/tests/tuner/**
      - .github/workflows/deluge-tuner-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mastertune-1.2.1/tools
            mastertune-1.2.1/tests/tuner

      - name: Version
        shell: bash
        run: |
          src=mastertune-1.2.1/tools/deluge_tuner.py
          v=$(sed -n 's/^VERSION = \([0-9][0-9]*\).*/\1/p' "$src")
          change=$(sed -n "s/^  $v  //p" "$src" | tr -d '\r' | head -n 1)
          if [ -z "$v" ] || [ -z "$change" ]; then
            echo "::error file=$src::VERSION or its line under Versions is missing"
            exit 1
          fi
          release=yes built=$GITHUB_SHA
          if git ls-remote --exit-code --tags origin "refs/tags/deluge-tuner-v$v" > /dev/null; then
            git fetch --depth=1 origin "+refs/tags/deluge-tuner-v$v:refs/tags/deluge-tuner-v$v"
            for f in "$src" mastertune-1.2.1/tools/retune_library.py mastertune-1.2.1/tools/deluge_tuner.ico; do
              if [ "$(git rev-parse "deluge-tuner-v$v:$f")" != "$(git rev-parse "HEAD:$f")" ]; then
                echo "::error file=$src::v$v is released already and $f changed since: raise VERSION and add its line under Versions"
                exit 1
              fi
            done
            release=no built=$(git rev-parse "deluge-tuner-v$v^{commit}")
            echo "v$v is released already and unchanged: build and test only"
          fi
          echo "v$v: $change (release: $release)"
          { echo "V=$v"; echo "EXE=DelugeTuner-v$v.exe"; echo "CHANGE=$change"; echo "RELEASE=$release"; echo "BUILT=$built"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pyinstaller numpy soxr pylibrb

      - name: Tests
        run: |
          python -B mastertune-1.2.1/tests/tuner/test_deluge_tuner.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/version.txt" << EOF
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($V, 0, 0, 0), prodvers=($V, 0, 0, 0), mask=0x3f, flags=0x0, OS=0x40004,
                              fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[StringFileInfo([StringTable('040904B0', [
                    StringStruct('FileDescription', 'DelugeTuner'), StringStruct('FileVersion', '$V'),
                    StringStruct('InternalName', 'DelugeTuner'), StringStruct('OriginalFilename', '$EXE'),
                    StringStruct('ProductName', 'DelugeTuner'), StringStruct('ProductVersion', '$V')])]),
                  VarFileInfo([VarStruct('Translation', [1033, 1200])])])
          EOF
          # pylibrb reads its version from its package metadata as it loads: that metadata along, to be sure
          pyinstaller --noconfirm --onefile --windowed --name "${EXE%.exe}" --version-file "$RUNNER_TEMP/version.txt" \
            --icon mastertune-1.2.1/tools/deluge_tuner.ico --paths mastertune-1.2.1/tools --copy-metadata pylibrb \
            mastertune-1.2.1/tools/deluge_tuner.py

      - name: Self-test of the .exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest"
          $p = Start-Process -FilePath "dist\$env:EXE" -ArgumentList "--selftest", "--out", $out -Wait -PassThru
          $txt = Get-Content (Join-Path $out "selftest.txt")
          $txt
          $exe = Get-Item "dist\$env:EXE"
          "$($exe.Name): $($exe.Length) bytes, version $($exe.VersionInfo.ProductVersion), SHA-256 $((Get-FileHash $exe.FullName).Hash)"
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }
          if ($txt -notcontains "version: v$env:V") { throw "the program does not say v$env:V" }
          foreach ($step in "soxr", "rubberband", "read", "convert", "processes", "resume", "window", "english") {
            if ($txt -notcontains "${step}: ok") { throw "self-test step $step failed" }
          }
          if ($exe.VersionInfo.ProductVersion -ne $env:V) { throw "the file's version is not $env:V" }

      - uses: actions/upload-artifact@v4
        with:
          name: DelugeTuner-v${{ env.V }}-windows
          path: dist/${{ env.EXE }}

      - name: Releases deluge-tuner-v${{ env.V }} and deluge-tuner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes() {
            printf '%s\n\n%s\n\n%s\n' "$1" \
              "Retunes the sample library of a Deluge card once to the master tune (mastertune firmware), so that its samples play natively: retune_library.py in a window, in German or English (the switch in the window). KARTE/CARD: the SD card or a copy of it, only read. ZIEL/OUTPUT: a folder on the computer for the new card, to copy onto an empty SD card. The gold knob: the tuning, 415.3 to 466.2 Hz (432 to start with). LESEN/READ shows what it would do, UMSTIMMEN/RETUNE writes the new card; ESC stops it, START continues. Download $EXE and run it, nothing to install. Windows asks at the first start because the file is not signed: More info, then Run anyway." \
              "Built from ${BUILT:0:8}. Source: mastertune-1.2.1/tools/deluge_tuner.py, its list Versions says what changed."
          }
          if [ "$RELEASE" = yes ]; then
            gh release create "deluge-tuner-v$V" "dist/$EXE" --prerelease --target "$GITHUB_SHA" \
              --title "DelugeTuner v$V" --notes "$(notes "v$V: $CHANGE.")"
          else  # deluge-tuner gets the released file, not this build's: no two builds are the same byte for byte
            rm -f "dist/$EXE"
            gh release download "deluge-tuner-v$V" --pattern "$EXE" --dir dist
          fi
          # deluge-tuner: always the newest version, as its only file
          gh release view deluge-tuner > /dev/null 2>&1 || gh release create deluge-tuner --prerelease \
            --target "$GITHUB_SHA" --title "DelugeTuner for Windows" --notes "DelugeTuner for Windows"
          gh release upload deluge-tuner "dist/$EXE" --clobber
          for old in $(gh release view deluge-tuner --json assets --jq '.assets[].name'); do
            [ "$old" = "$EXE" ] || gh release delete-asset deluge-tuner "$old" --yes
          done
          gh release edit deluge-tuner --title "DelugeTuner for Windows (v$V)" \
            --notes "$(notes "Always the newest version, now v$V: $CHANGE. Every version also keeps its own release: deluge-tuner-v1, deluge-tuner-v2 ...")"
